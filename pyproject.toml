[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "movielens-analysis-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "pydantic>=2.8,<3",
  "pymysql>=1.1,<2",
  "httpx>=0.27,<1",
  "python-dotenv>=1,<2",
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
movielens-worker = "backend.worker:main"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
