services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: movielens
      MYSQL_USER: movielens
      MYSQL_PASSWORD: movielens
      MYSQL_ROOT_PASSWORD: change-me
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pmovielens"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data:
